<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>أعمالي</title>

<style>

body{
margin:0;
font-family:Arial;
background:#0f172a;
color:white;
}

/* الهيدر */

header{
background:#020617;
padding:20px;
text-align:center;
}

header a{
color:#38bdf8;
text-decoration:none;
font-size:18px;
}

/* العنوان */

.title{
text-align:center;
margin-top:40px;
font-size:35px;
}

/* قائمة الأعمال */

.container{
display:flex;
justify-content:center;
flex-wrap:wrap;
gap:25px;
padding:40px;
}

/* الكارت */

.card{
background:#1e293b;
width:280px;
padding:25px;
border-radius:15px;
text-align:center;
transition:0.3s;
box-shadow:0 5px 15px rgba(0,0,0,0.4);
}

.card:hover{
transform:translateY(-10px);
}

/* زرار */

.btn{
display:inline-block;
margin-top:15px;
background:#38bdf8;
color:black;
padding:10px 20px;
border-radius:8px;
text-decoration:none;
font-weight:bold;
transition:0.3s;
}

.btn:hover{
background:#0ea5e9;
}

/* الفوتر */

footer{
background:#020617;
text-align:center;
padding:15px;
margin-top:30px;
}

</style>

</head>

<body>

<header>

<h1>أعمالي</h1>

<a href="index.html">الرجوع للرئيسية</a>

</header>

<h2 class="title">مشاريعي</h2>

<div class="container">

<div class="card">
<h3>قصص خيال علمى</h3>
<p>قصة خيال علمي عن السفر عبر الزمن.</p>
<a href="https://drive.google.com/file/d/1NTk1oft0d_bxrGfvl_kVt8OzOQIoJE4o/view?usp=drivesdk" class="btn">عرض التفاصيل</a>
</div>

<div class="card">
<h3>مشاريع الذكاء الصناعي</h3>
<p>تعلم برمجة التطبيقات والذكاء الصناعي.</p>
<a href="#" class="btn">مشاهدة المشروع</a>
</div>

<div class="card">
<h3>الرسم والتصميم</h3>
<p>أعمالي في الرسم والتصميم المعماري.</p>
<a href="#" class="btn">عرض الأعمال</a>
</div>


</div>

<footer>

<p>© 2026 يوسف هاني شلبي</p>

</footer>

</body>
</html>
